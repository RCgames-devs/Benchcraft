<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchcraft - Build Beyond Your Limits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .stats {
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .stats div {
            margin: 5px 0;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            z-index: 50;
            pointer-events: none;
        }

        .crosshair-h {
            position: absolute;
            width: 8px;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair-v {
            position: absolute;
            width: 1px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            opacity: 0.7;
            max-width: 300px;
        }

        .control-item {
            margin: 5px 0;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 200;
            display: none;
        }

        .loader {
            border: 4px solid #333;
            border-radius: 50%;
            border-top: 4px solid #0088ff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">
            <div>FPS: <span id="fps">0</span></div>
            <div>Chunks: <span id="chunks">0</span></div>
            <div>Blocks: <span id="blocks">0</span></div>
            <div>Position: <span id="position">0, 0, 0</span></div>
        </div>
    </div>

    <div id="crosshair">
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
    </div>

    <div id="controls">
        <div class="control-item"><strong>Controls:</strong></div>
        <div class="control-item">W/A/S/D - Move</div>
        <div class="control-item">Space - Jump</div>
        <div class="control-item">Mouse - Look Around</div>
        <div class="control-item">Left Click - Destroy Block</div>
        <div class="control-item">Right Click - Place Block</div>
        <div class="control-item">Escape - Toggle Mouse Lock</div>
    </div>

    <div id="loading">
        <div class="loader"></div>
        <div>Loading world...</div>
    </div>
</body>
</html>
