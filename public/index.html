<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benchcraft Prototype</title>
    <style>
      :root {
        --bg: rgba(11, 16, 22, 0.7);
        --panel: rgba(18, 24, 32, 0.5);
        --text: #edf6ff;
        --muted: #afc8dc;
        --accent: #67d4ff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #7ecbff;
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        left: 20px;
        top: 20px;
        z-index: 10;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 12px 16px;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      #hud h1 {
        margin: 0 0 8px 0;
        font-size: 20px;
        letter-spacing: 0.05em;
      }

      .stat {
        margin: 4px 0;
        font-size: 14px;
        color: var(--muted);
      }

      .stat strong {
        color: var(--text);
      }

      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 9;
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.8);
        box-shadow: 0 0 4px rgba(0,0,0,0.5);
      }

      #crosshair::before {
        left: 9px;
        top: 0;
        width: 2px;
        height: 20px;
      }

      #crosshair::after {
        left: 0;
        top: 9px;
        width: 20px;
        height: 2px;
      }

      #help {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 12px 16px;
        backdrop-filter: blur(6px);
        color: var(--muted);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        font-size: 12px;
        line-height: 1.65;
      }

      #help strong {
        color: var(--text);
      }

      #message {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.4);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 15;
      }

      #message.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Benchcraft</h1>
      <div class="stat"><strong>FPS:</strong> <span id="fps">0</span></div>
      <div class="stat"><strong>Blocks:</strong> <span id="blockCount">0</span></div>
      <div class="stat"><strong>Position:</strong> <span id="position">0, 0, 0</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="help">
      <strong>Controls</strong><br />
      W/A/S/D = Move<br />
      Space = Jump<br />
      Mouse = Look<br />
      Left Click = Break block<br />
      Right Click = Place block<br />
      Click to lock cursor
    </div>

    <div id="message">Click to lock pointer</div>

    <script type="module" src="../src/index.js"></script>
  </body>
</html>
